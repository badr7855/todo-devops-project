version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - backend-network

  flask-api:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - frontend-network
      - backend-network
    environment:
      - MONGO_URI=mongodb://mongodb:27017/todo_db

  react-ui:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - flask-api
    networks:
      - frontend-network
    # This allows React to find the backend if you are using standard create-react-app proxying
    stdin_open: true
    tty: true

networks:
  frontend-network:
  backend-network:
